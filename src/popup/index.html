<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YouTube Auto Fullscreen</title>
    <link rel="stylesheet" href="index.css" />
    <script type="module" src="index.js"></script>
  </head>
  <body>
    <main aria-busy="true" aria-labelledby="popup-title">
      <h1 id="popup-title">YouTube Auto Fullscreen</h1>
      <form>
        <fieldset>
          <legend id="preference-label">Automatic fullscreen</legend>
          <div class="preference-control">
            <input
              id="enabled"
              type="checkbox"
              aria-describedby="status"
              disabled
            />
            <label for="enabled">
              <span id="toggle-label">Enable for videos and live streams</span>
              <span id="toggle-state" aria-hidden="true">Loading…</span>
            </label>
          </div>
        </fieldset>
      </form>
      <p id="status" role="status" aria-live="polite" aria-atomic="true">
        Loading preference…
      </p>
    </main>
  </body>
</html>
